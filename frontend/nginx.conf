# Bu konteyner faqat SPA'ni xizmat qiladi — API proxy, CSP va boshqa
# xavfsizlik sarlavhalari domenning bir bosqich yuqorisidagi reverse-proxy
# (../proxy-nginx.conf) tomonidan qo'shiladi.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # MUHIM: index.html HECH QACHON keshlanmasligi kerak. JS/CSS fayllari
    # kontent-hash bilan nomlangan (masalan index-Bk6GVMPe.js) - har build'da
    # nom o'zgaradi, shuning uchun ularni 1 yilga "immutable" deb keshlash
    # xavfsiz. Lekin index.html'NING O'ZI keshlansa (brauzer yoki Cloudflare
    # edge tomonidan), u ESKI build'dagi hash'larga ishora qilib qolaveradi -
    # keyingi deploy'da o'sha eski JS fayllar dist'dan o'chirilgani uchun
    # sahifa qisman/noto'liq yuklanadi (masalan yangi bosqichda qo'shilgan
    # sahifalar "shakllanmagan" ko'rinadi) - aynan shu sabab bilan
    # 2026-09-04'da savdo.ecos.uz'da Kassa/Ombor/Hisobotlar to'liq
    # ko'rinmagan edi.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Tenant ("/") va superadmin ("/spd/*") ikkalasi ham bitta SPA bundle —
    # React Router client-side yo'naltiradi, shuning uchun har qanday
    # topilmagan yo'l index.html'ga tushadi.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
