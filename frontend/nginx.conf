# Bu konteyner faqat SPA'ni xizmat qiladi — API proxy, CSP va boshqa
# xavfsizlik sarlavhalari domenning bir bosqich yuqorisidagi reverse-proxy
# (../proxy-nginx.conf) tomonidan qo'shiladi.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Tenant ("/") va superadmin ("/spd/*") ikkalasi ham bitta SPA bundle —
    # React Router client-side yo'naltiradi, shuning uchun har qanday
    # topilmagan yo'l index.html'ga tushadi.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
