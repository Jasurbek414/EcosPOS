name: CI

# Sabab: 2026-09-13 auditigacha loyihada birorta ham avtomatik tekshiruv yo'q edi.
# Aynan shuning uchun butun ilovani oq ekranga aylantirgan xato (Sidebar'da
# yo'qolgan import) qurilishdan bemalol o'tib, jonli serverga chiqib ketgan.
#
# DIQQAT: repozitoriy ochiq. Bu yerda HECH QANDAY maxfiy qiymat ishlatilmaydi.

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (build + testlar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Testlar bilan qurish
        working-directory: backend
        run: mvn -B clean verify

      - name: Test hisobotlarini saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-natijalari
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bog'liqliklarni o'rnatish
        working-directory: frontend
        run: npm ci

      # ESLint aynan "NavLink import qilinmagan" turidagi xatoni ushlaydi —
      # Vite build esa ushlamaydi. Shuning uchun bu qadam build'dan OLDIN turadi.
      - name: ESLint
        working-directory: frontend
        run: npx eslint .

      - name: Build
        working-directory: frontend
        run: npm run build

  mobile:
    name: Mobil (analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'   # aniq versiya - suzuvchi "stable" EMAS

      - name: Bog'liqliklar
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

  xavfsizlik:
    name: Maxfiy ma'lumot va bog'liqlik tekshiruvi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks butun tarixni ko'rishi uchun

      # Repozitoriy ilgari tunnel tokeni va JWT kalitini sizdirgan — bu qadam
      # shunday hodisa qaytalanmasligi uchun.
      - name: Gitleaks (maxfiy qiymatlar)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (yuqori darajali zaifliklar)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true   # hisobot beradi, lekin CI'ni to'xtatmaydi
