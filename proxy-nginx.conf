# service-core/proxy-nginx.conf'dagi (192.168.100.10 serverida jonli sinovdan
# o'tgan) qattiq saboqlarni takrorlaydi - qarang shu loyihaning rejasi
# (C:\Users\sheikh\.claude\plans\elegant-prancing-diffie.md):
#
# 1) proxy_pass'da to'g'ridan-to'g'ri "backend:8080" YOZILMAYDI - Docker
#    konteyner qayta yaratilganda yangi IP oladi, nginx esa nomni FAQAT BIR
#    MARTA ishga tushishda yechib abadiy keshlaydi -> "docker compose up -d
#    backend" dan keyin 502 (yoki battarroq, so'rov BOSHQA konteynerga
#    ketishi mumkin). Yechim: $upstream_* o'zgaruvchi + resolver bilan har
#    so'rovda qayta yechish.
# 2) Cloudflare tunnel "http://localhost:PORT"ga murojaat qiladi, "localhost"
#    esa AVVAL IPv6 (::1)ga yechiladi - shuning uchun set_real_ip_from'da
#    127.0.0.1 BILAN BIRGA ::1 ham SHART, aks holda CF-Connecting-IP orqali
#    haqiqiy mijoz IP'si HECH QACHON qo'llanmaydi va limit_req GLOBAL
#    (hammaga umumiy) throttle'ga aylanadi.
resolver 127.0.0.11 valid=10s ipv6=off;
real_ip_header CF-Connecting-IP;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;

# CSP: bu ilovaning HAQIQIY manba ro'yxati (build kattalashgani sayin
# yangilanadi - masalan xarita/QR kutubxonasi qo'shilsa shu yerga ham
# domen qo'shish kerak bo'ladi).
#
# MUHIM (jonli sinovda topilgan, 2026-09-04): ikkita narsa qo'shildi -
# 1) connect-src'ga https://savdo-api.ecos.uz ANIQ ko'rsatildi. Frontend
#    build vaqtida VITE_API_BASE_URL=https://savdo-api.ecos.uz bilan
#    qurilgan - bu savdo.ecos.uz'dan BOSHQA origin (CSP nuqtai nazaridan
#    hostname farqi = boshqa origin, garchi ikkalasi ham bir xil
#    localhost:80'ga tushsa ham) - shuning uchun faqat "'self'" YETARLI
#    EMAS edi, login so'rovi jimgina bloklanardi (browser konsolida
#    "violates ... connect-src" xatosi bilan aniqlangan).
# 2) script-src'ga https://static.cloudflareinsights.com qo'shildi -
#    Cloudflare proksi orqali o'tgan har bir sahifaga o'zi avtomatik
#    "beacon.min.js" analitika skriptini in'ektsiya qiladi (zonaning Web
#    Analytics/Browser Insights sozlamasi yoqilgan bo'lsa) - busiz CSP uni
#    ham bloklaydi (zararsiz, lekin brauzer konsolida xato chiqaveradi).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://savdo-api.ecos.uz https://static.cloudflareinsights.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

limit_req_zone $binary_remote_addr zone=savdo_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=savdo_login_limit:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;

    # add_header bu darajada YOZILMAYDI - nginx meros qoidasi: joriy blokda
    # bittasi yozilsa, http darajasidagi HAMMASI jimgina bekor bo'ladi.

    location = /api/v1/auth/login {
        limit_req zone=savdo_login_limit burst=3 nodelay;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        set $upstream_backend backend:8080;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/platform/auth/login {
        limit_req zone=savdo_login_limit burst=3 nodelay;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        set $upstream_backend backend:8080;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=savdo_api_limit burst=20 nodelay;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        set $upstream_backend backend:8080;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mobil APK'ni to'g'ridan havola orqali yuklab olish uchun (6-bosqich,
    # hozircha papka bo'sh bo'lishi mumkin - volume shart emas).
    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        add_header Content-Disposition "attachment";
        autoindex off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires -1;
    }

    location / {
        set $upstream_frontend frontend:80;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
