spring:
  application:
    name: savdo-backend

  # ===========================
  # BOOTSTRAP DATASOURCE (tenant routing)
  # ATAYLAB tenant yoki platform_db emas — ilova ishga tushayotganda (Flyway/Hibernate
  # schema tekshiruvi paytida, TenantContext hali bo'sh bo'lganda) ishlatiladigan
  # neytral ulanish. Har doim mavjud bo'lgan Postgres tizim bazasiga ishora qiladi,
  # shu bilan hech qanday haqiqiy kompaniya yoki platform ma'lumotlari bilan
  # to'qnashmaydi. Qarang: uz.savdo.config.TenantDataSourceConfig.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_BOOTSTRAP_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

# ===========================
# PLATFORM (MASTER) DATABASE — superadmin, kompaniyalar, audit
# Tenant bazalaridan butunlay alohida, ikkinchi ulanish (JdbcTemplate) orqali.
# ===========================
platform:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PLATFORM_DB_NAME:platform_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration-platform

# Yangi tenant bazalari qaysi Postgres server (host:port)da yaratilishi kerak —
# barcha kompaniyalar bir xil serverda, alohida database sifatida yashaydi.
tenant:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}

# ===========================
# JWT SETTINGS
# ===========================
app:
  jwt:
    # DIQQAT: quyidagi qiymat faqat lokal dev uchun placeholder.
    # Prod'da JWT_SECRET env o'zgaruvchisi orqali tasodifiy kalit berilishi SHART.
    secret: ${JWT_SECRET:local-dev-only-do-not-use-in-production-000000000000}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION_MS:1800000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  # Mahsulot rasmlari kabi yuklangan fayllar qayerga yozilishi (uz.savdo.controller.FileController).
  # Prod'da UPLOAD_DIR=/app/uploads (docker-compose.yml'dagi savdo_uploads named volume'ga
  # bog'langan, konteyner qayta yaratilganda yo'qolib qolmaydi) - lokal dev uchun standart
  # qiymat ishchi papkadagi ./uploads.
  upload:
    dir: ${UPLOAD_DIR:./uploads}

# ===========================
# SWAGGER / OPENAPI
# ===========================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ===========================
# LOGGING
# ===========================
logging:
  level:
    root: INFO
    uz.savdo: DEBUG
    org.springframework.security: INFO
