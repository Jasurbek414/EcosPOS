# "savdo" - do'kon/supermarketlar uchun POS ekotizimi.
#
# MUHIM: bu server (192.168.100.10) da allaqachon "service-core" (telefoniya)
# loyihasi ishlaydi (C:\service-core, tarmog'i 172.19.0.0/16, portlari
# 3005/8082/5437/443/3478/5060/16384-16483). Bu compose ATAYLAB butunlay
# ALOHIDA: boshqa tarmoq (172.30.0.0/16 - bu noutbukdagi boshqa loyihalar
# 172.17-172.26 oralig'ini band qilgani uchun ham shu son tanlandi), boshqa
# portlar, boshqa papka (D:\savdo). service-core konteynerlariga HECH QACHON
# tegilmaydi.
#
# Portlar/tarmoq bandligi haqida: C:\Users\sheikh\.claude\plans\elegant-prancing-diffie.md

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: savdo-db
    mem_limit: 512m
    cpu_shares: 1024
    logging: *default-logging
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?.env faylida DB_PASSWORD belgilanishi shart}
    ports:
      # Faqat shu mashinaning o'zidan - xavfsizlik: butun tarmoqqa ochilmasin.
      - "127.0.0.1:5440:5432"
    volumes:
      - savdo_postgres_data:/var/lib/postgresql/data
      # Bo'sh data-katalogda BIR MARTA ishga tushadi - platform_db yaratadi.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    restart: always
    networks:
      default:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: savdo-backend
    mem_limit: 1g
    cpu_shares: 1024
    logging: *default-logging
    ports:
      # Lokal debug uchun ochiq - tashqi kirish faqat proxy/tunnel orqali.
      # MUHIM: 8090 EMAS - bu noutbukda "ishchi" loyihasi (ishchi-backend)
      # allaqachon 8090'ni band qilgan (docker ps bilan tekshirilgan).
      - "127.0.0.1:8095:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_BOOTSTRAP_NAME=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - PLATFORM_DB_NAME=platform_db
      - JWT_SECRET=${JWT_SECRET:?.env faylida JWT_SECRET belgilanishi shart}
      - JWT_ACCESS_EXPIRATION_MS=1800000
      - JWT_REFRESH_EXPIRATION_MS=604800000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3010}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      default:
        ipv4_address: 172.30.0.13
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: savdo-frontend
    mem_limit: 128m
    cpu_shares: 512
    logging: *default-logging
    ports:
      - "127.0.0.1:3010:80"
    restart: always
    networks:
      default:
        ipv4_address: 172.30.0.11
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: nginx:alpine
    container_name: savdo-proxy
    mem_limit: 128m
    cpu_shares: 512
    logging: *default-logging
    restart: always
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      # 7-bosqichda Cloudflare Tunnel token kelgach, bu yerga "tunnel"
      # xizmati network_mode: service:proxy bilan qo'shiladi (service-core
      # bilan bir xil pattern) - shu host-port mapping lokal/SSH-tunnel
      # orqali debug uchun qoladi.
      - "127.0.0.1:3011:80"
    volumes:
      - ./proxy-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./downloads:/usr/share/nginx/downloads:ro
    depends_on:
      - frontend
      - backend
    networks:
      default:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 7-bosqich: tashqi domenga chiqarish. CLOUDFLARE_TUNNEL_TOKEN .env'da
  # bo'lmasa bu xizmat oddiygina ishga tushmay qoladi (compose xato bermaydi,
  # faqat bu bitta konteyner health-check kutmasdan qulab tushadi va restart:
  # always tufayli qayta-qayta urinaveradi) - shuning uchun tokensiz ham
  # qolgan xizmatlarga (mahalliy/SSH orqali) hech qanday ta'sir qilmaydi.
  # Cloudflare Zero Trust panelida Public Hostname sozlanganda ikkala
  # hostname (savdo.ecos.uz VA savdo-api.ecos.uz) uchun ham "Service" maydoniga
  # HTTP + localhost:80 yoziladi - nginx frontend/API'ni PORT emas, YO'L
  # (/ vs /api/) orqali ajratadi, shuning uchun ikkala hostname bir xil
  # manzilga yo'naltiriladi (service-core'dagi ikki-port sxemasidan farqli).
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: savdo-tunnel
    # ATAYLAB standart "docker compose up" bilan ISHGA TUSHMAYDI (profiles) -
    # CLOUDFLARE_TUNNEL_TOKEN hali yo'q, bo'sh token bilan cloudflared darhol
    # xato berib qayta-qayta restart bo'laveradi (zararsiz, lekin keraksiz log
    # shovqini). Token .env'ga qo'shilgach: "docker compose --profile tunnel
    # up -d --build" (yoki shu qatorni butunlay o'chirib tashlash).
    profiles: ["tunnel"]
    mem_limit: 128m
    cpu_shares: 512
    logging: *default-logging
    restart: always
    network_mode: "service:proxy"
    user: "root"
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--protocol"
      - "http2"
      - "run"
      - "--token"
      - "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      - proxy

volumes:
  savdo_postgres_data:

networks:
  default:
    name: savdo_net
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
